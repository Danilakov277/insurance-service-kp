<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860"><defs><marker id="a1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#000"/></marker><marker id="a2" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1.5 L0,5 L10,8.5 z" fill="#000"/></marker></defs><rect width="1500" height="860" fill="#fff"/><rect x="20" y="20" width="360" height="820" rx="8" fill="#F4F6F8" stroke="#555" stroke-width="1.2" stroke-dasharray="8,5"/><text x="200.0" y="46" font-size="15" text-anchor="middle" font-weight="bold">Уровень представления</text><text x="200.0" y="64" font-size="15" text-anchor="middle" font-weight="bold">(клиентское приложение, JVM клиента)</text><rect x="420" y="20" width="760" height="820" rx="8" fill="#F4F6F8" stroke="#555" stroke-width="1.2" stroke-dasharray="8,5"/><text x="800.0" y="46" font-size="15" text-anchor="middle" font-weight="bold">Уровень бизнес-логики</text><text x="800.0" y="64" font-size="15" text-anchor="middle" font-weight="bold">(сервер приложений, JVM сервера)</text><rect x="1220" y="20" width="260" height="820" rx="8" fill="#F4F6F8" stroke="#555" stroke-width="1.2" stroke-dasharray="8,5"/><text x="1350.0" y="46" font-size="15" text-anchor="middle" font-weight="bold">Уровень данных</text><text x="1350.0" y="64" font-size="15" text-anchor="middle" font-weight="bold">(СУБД)</text><rect x="50" y="110" width="300" height="150" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="200.0" y="130" font-size="15" text-anchor="middle" font-weight="bold">Окна и панели Swing</text><text x="200.0" y="150" font-size="13" text-anchor="middle" font-weight="normal">LoginFrame, RegisterDialog</text><text x="200.0" y="166" font-size="13" text-anchor="middle" font-weight="normal">ClientFrame, AgentFrame, AdminFrame</text><text x="200.0" y="182" font-size="13" text-anchor="middle" font-weight="normal">(наследники BaseFrame)</text><text x="200.0" y="198" font-size="13" text-anchor="middle" font-weight="normal">панели вкладок, таблицы, диаграммы</text><rect x="50" y="310" width="300" height="90" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="200.0" y="330" font-size="15" text-anchor="middle" font-weight="bold">Ui</text><text x="200.0" y="350" font-size="13" text-anchor="middle" font-weight="normal">вызов команд, сообщения,</text><text x="200.0" y="366" font-size="13" text-anchor="middle" font-weight="normal">обработка ошибок ввода</text><rect x="50" y="450" width="300" height="110" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="200.0" y="470" font-size="15" text-anchor="middle" font-weight="bold">ServerConnection</text><text x="200.0" y="490" font-size="13" text-anchor="middle" font-weight="normal">«Одиночка»: сокет,</text><text x="200.0" y="506" font-size="13" text-anchor="middle" font-weight="normal">ObjectOutputStream / ObjectInputStream,</text><text x="200.0" y="522" font-size="13" text-anchor="middle" font-weight="normal">повтор при обрыве</text><rect x="50" y="620" width="300" height="80" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="200.0" y="640" font-size="15" text-anchor="middle" font-weight="bold">common (общий модуль)</text><text x="200.0" y="660" font-size="13" text-anchor="middle" font-weight="normal">модель, Request / Response,</text><text x="200.0" y="676" font-size="13" text-anchor="middle" font-weight="normal">CommandType, исключения</text><polyline points="200,260 200,310" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)"/><polyline points="200,400 200,450" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)"/><polyline points="350,505 460,505" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)" marker-start="url(#a2)"/><text x="405" y="492" font-size="13" text-anchor="middle" font-weight="normal">TCP/IP, порт 5555</text><text x="405" y="528" font-size="12" text-anchor="middle" font-weight="normal">Request / Response</text><text x="405" y="543" font-size="12" text-anchor="middle" font-weight="normal">(сериализация)</text><rect x="460" y="100" width="320" height="100" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="620.0" y="120" font-size="15" text-anchor="middle" font-weight="bold">ServerApp</text><text x="620.0" y="140" font-size="13" text-anchor="middle" font-weight="normal">ServerSocket.accept();</text><text x="620.0" y="156" font-size="13" text-anchor="middle" font-weight="normal">настройки ServerConfig</text><text x="620.0" y="172" font-size="13" text-anchor="middle" font-weight="normal">(server.properties, аргументы)</text><rect x="460" y="250" width="320" height="100" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="620.0" y="270" font-size="15" text-anchor="middle" font-weight="bold">ExecutorService</text><text x="620.0" y="290" font-size="13" text-anchor="middle" font-weight="normal">пул из N потоков (server.threads);</text><text x="620.0" y="306" font-size="13" text-anchor="middle" font-weight="normal">подключение → задача пула</text><rect x="460" y="400" width="320" height="150" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="620.0" y="420" font-size="15" text-anchor="middle" font-weight="bold">ClientHandler × N</text><text x="620.0" y="440" font-size="13" text-anchor="middle" font-weight="normal">по потоку на подключение:</text><text x="620.0" y="456" font-size="13" text-anchor="middle" font-weight="normal">чтение Request, сеанс Session,</text><text x="620.0" y="472" font-size="13" text-anchor="middle" font-weight="normal">отправка Response; перевод</text><text x="620.0" y="488" font-size="13" text-anchor="middle" font-weight="normal">исключений в сообщения</text><rect x="840" y="100" width="310" height="110" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="995.0" y="120" font-size="15" text-anchor="middle" font-weight="bold">CommandDispatcher</text><text x="995.0" y="140" font-size="13" text-anchor="middle" font-weight="normal">«Команда»: CommandType →</text><text x="995.0" y="156" font-size="13" text-anchor="middle" font-weight="normal">CommandHandler; проверка</text><text x="995.0" y="172" font-size="13" text-anchor="middle" font-weight="normal">авторизации и роли</text><rect x="840" y="250" width="310" height="150" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="995.0" y="270" font-size="15" text-anchor="middle" font-weight="bold">Сервисы</text><text x="995.0" y="290" font-size="13" text-anchor="middle" font-weight="normal">AuthService, ApplicationService,</text><text x="995.0" y="306" font-size="13" text-anchor="middle" font-weight="normal">PolicyService, ClaimService,</text><text x="995.0" y="322" font-size="13" text-anchor="middle" font-weight="normal">AdminService, ReportService;</text><text x="995.0" y="338" font-size="13" text-anchor="middle" font-weight="normal">границы транзакций</text><rect x="840" y="440" width="310" height="130" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="995.0" y="460" font-size="15" text-anchor="middle" font-weight="bold">Бизнес-логика (logic)</text><text x="995.0" y="480" font-size="13" text-anchor="middle" font-weight="normal">PremiumCalculator + стратегии,</text><text x="995.0" y="496" font-size="13" text-anchor="middle" font-weight="normal">PayoutCalculator, RefundCalculator,</text><text x="995.0" y="512" font-size="13" text-anchor="middle" font-weight="normal">InstallmentScheduler,</text><text x="995.0" y="528" font-size="13" text-anchor="middle" font-weight="normal">PolicyStatusRules</text><rect x="840" y="610" width="310" height="90" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="995.0" y="630" font-size="15" text-anchor="middle" font-weight="bold">DAO (dao)</text><text x="995.0" y="650" font-size="13" text-anchor="middle" font-weight="normal">AbstractDao и 9 наследников,</text><text x="995.0" y="666" font-size="13" text-anchor="middle" font-weight="normal">SQL через PreparedStatement</text><rect x="840" y="735" width="310" height="90" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="995.0" y="755" font-size="15" text-anchor="middle" font-weight="bold">ConnectionManager</text><text x="995.0" y="775" font-size="13" text-anchor="middle" font-weight="normal">«Одиночка»: пул соединений JDBC,</text><text x="995.0" y="791" font-size="13" text-anchor="middle" font-weight="normal">inTransaction / withConnection</text><rect x="460" y="640" width="320" height="100" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="620.0" y="660" font-size="15" text-anchor="middle" font-weight="bold">Планировщик</text><text x="620.0" y="680" font-size="13" text-anchor="middle" font-weight="normal">ScheduledExecutorService:</text><text x="620.0" y="696" font-size="13" text-anchor="middle" font-weight="normal">пересчёт состояний договоров</text><text x="620.0" y="712" font-size="13" text-anchor="middle" font-weight="normal">каждые 6 ч</text><polyline points="620,200 620,250" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)"/><polyline points="620,350 620,400" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)"/><polyline points="780,470 810,470 810,155 840,155" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)"/><polyline points="995,210 995,250" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)"/><polyline points="995,400 995,440" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)"/><polyline points="1120,400 1120,610" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)"/><polyline points="995,570 995,610" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)"/><polyline points="995,700 995,735" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)"/><polyline points="780,690 815,690 815,340 840,340" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)" stroke-dasharray="6,4"/><path d="M1260,430 a90,22 0 0,0 180,0 a90,22 0 0,0 -180,0 v170 a90,22 0 0,0 180,0 v-170" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="1350" y="490" font-size="15" text-anchor="middle" font-weight="bold">PostgreSQL 16</text><text x="1350" y="515" font-size="13" text-anchor="middle" font-weight="normal">БД insurance:</text><text x="1350" y="531" font-size="13" text-anchor="middle" font-weight="normal">9 таблиц (3НФ),</text><text x="1350" y="547" font-size="13" text-anchor="middle" font-weight="normal">внешние ключи,</text><text x="1350" y="563" font-size="13" text-anchor="middle" font-weight="normal">ограничения CHECK</text><polyline points="1150,780 1200,780 1200,560 1260,560" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a1)" marker-start="url(#a2)"/><text x="1240" y="640" font-size="13" text-anchor="middle" font-weight="normal">JDBC,</text><text x="1240" y="656" font-size="13" text-anchor="middle" font-weight="normal">порт 5432</text></svg>